<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1930">
  <title>Page not found | Hasanur Rahman</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script>
    // A link to a brand-new article may arrive before its page has been built (it takes up to ~30 minutes).
    // In that case open the article through the main site, which always has it.
    (function () {
      var m = location.pathname.match(/^\/articles\/([^\/]+)\/?$/);
      if (m) location.replace("/#article-" + m[1]);
    })();
  </script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #fff;
      background: linear-gradient(180deg, rgba(10, 25, 48, .9), rgba(10, 25, 48, .96)), url("/hero.webp") center / cover no-repeat, #0a1930; }
    main { width: min(34rem, 100%); text-align: center; }
    img { width: 84px; height: auto; margin: 0 auto 1.4rem; display: block; }
    .code { margin: 0; font: 600 .8rem system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #b8975a; }
    h1 { margin: .5rem 0 .8rem; font: 500 clamp(1.9rem, 6vw, 2.6rem)/1.15 Georgia, "Times New Roman", serif; }
    p { margin: 0 0 1.6rem; color: #c9d3e6; }
    a.btn { display: inline-block; padding: .8rem 1.5rem; color: #0a1930; background: #fff; border-radius: 8px; font-weight: 600; text-decoration: none; }
    a.btn:hover { background: #f3f5f9; }
    a.btn:focus-visible { outline: 3px solid #b8975a; outline-offset: 3px; }
    .links { margin-top: 1.3rem; font-size: .95rem; }
    .links a { color: #c9d3e6; margin: 0 .6rem; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="" width="150" height="111">
    <p class="code">Error 404</p>
    <h1>This page could not be found</h1>
    <p>The address may be mistyped, or the page may have moved. You can go back to the homepage and find the analysis from there.</p>
    <a class="btn" href="/">Go to the homepage</a>
    <p class="links"><a href="/#articles">Articles</a><a href="/#research">Research</a><a href="/#about">About</a></p>
  </main>
</body>
</html>
