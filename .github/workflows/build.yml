name: Build site

# Creates a real page for every published article (articles/<name>/), plus sitemap.xml and rss.xml.
# Runs by itself about every 30 minutes, whenever the template files change,
# and any time you press "Run workflow" (Actions tab).
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    paths:
      - "tools/**"
      - "index.html"
      - "articles.js"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate article pages, sitemap and RSS
        run: node tools/build.mjs
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles sitemap.xml rss.xml
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build article pages [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
